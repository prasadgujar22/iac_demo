# WDT variable file. Values are static build-time topology names only.
#
# Admin credentials are DELIBERATELY NOT here. They used to be
# (admin.username/admin.password with the latter left as a literal, never-
# substituted "CHANGE_ME_AT_BUILD_TIME" placeholder) and every domain silently
# got created with that placeholder as its real admin password, while the
# operator's generated boot.properties always used the actual K8s secret —
# a permanent mismatch ("BEA-090402 Authentication denied: Boot identity not
# valid") on every AdminServer boot. The model now sources credentials
# directly from the operator's __weblogic-credentials__ secret macro instead,
# which always matches whatever spec.webLogicCredentialsSecret currently holds.
domain.name=wls_domain
cluster.name=WLSCluster
cluster.size=2

# Application baked into the image (see appDeployments in the model). The WAR
# itself is built by the app_build Ansible role and packaged into
# .generated/archive.zip before `packer build` runs.
app.name=customer-onboarding
app.war=customer-onboarding.war
