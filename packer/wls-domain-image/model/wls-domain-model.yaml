#
# WebLogic Deploy Tooling model — topology only.
#
# DELIBERATELY CONTAINS NO resources.JDBCSystemResource SECTION.
#
# A datasource declared here is instantiated on every pod start. If its database
# is unreachable, WebLogic reports:
#     BEA-149205 Failed to initialize the application "OracleDS"
#     BEA-149259 Server "ms1" ... brought up in administration state
# and NO application can deploy. The application manages its own JDBC pool and
# reads connection details from environment/config instead, so a database outage
# degrades one feature rather than the entire domain.
#
domainInfo:
    # The operator's introspector auto-populates the special __weblogic-credentials__
    # secret macros from spec.webLogicCredentialsSecret at EVERY introspection, so the
    # domain's real admin user always matches whatever the K8s secret currently holds.
    #
    # A custom @@PROP:admin.username@@/@@PROP:admin.password@@ pair looks equivalent
    # but is NOT: nothing in this pipeline actually populates those two specific
    # property names in the operator-generated variable file. WDT still resolved them
    # in this case — but from wls-domain.properties, which sits alongside the model in
    # the image (WDT auto-loads any .properties file it finds under WDT_MODEL_HOME) —
    # and that file's admin.password is a literal, never-substituted
    # "CHANGE_ME_AT_BUILD_TIME" placeholder. The domain's real admin user silently gets
    # created with that literal string as its password, while boot.properties is
    # generated per-pod-start from the ACTUAL K8s secret — a permanent mismatch that
    # surfaces as "BEA-090402 Authentication denied: Boot identity not valid" on every
    # AdminServer boot, regardless of how many times the secret is regenerated.
    AdminUserName: '@@SECRET:__weblogic-credentials__:username@@'
    AdminPassword: '@@SECRET:__weblogic-credentials__:password@@'
    ServerStartMode: 'prod'

topology:
    Name: '@@PROP:domain.name@@'
    ProductionModeEnabled: true

    AdminServerName: 'AdminServer'
    Server:
        'AdminServer':
            ListenPort: 7001
            # Empty string, not unset: WLS resolves an unset ListenAddress to
            # the container's hostname, which the AdministrationPort channel
            # then binds ONLY as 127.0.0.1 — unreachable from the kubelet's
            # network namespace, so the readiness probe gets "connection
            # refused" against the pod IP forever even though the server is
            # genuinely RUNNING. An explicit empty ListenAddress is WLS's
            # wildcard (bind all interfaces), which is what every channel
            # (including the administration channel) needs in a container.
            ListenAddress: ''
            ServerStart:
                Arguments: '-Xms1024m -Xmx1536m'

    Cluster:
        '@@PROP:cluster.name@@':
            ClientCertProxyEnabled: false
            # Unicast messaging: multicast is unreliable across CNI overlays.
            ClusterMessagingMode: 'unicast'
            # WDT models a dynamic cluster as DynamicServers NESTED under its
            # owning Cluster, not as a separate top-level "DynamicCluster:"
            # folder. The latter fails model validation ("DynamicCluster is
            # not one of the folder names allowed in model location
            # topology:/") and, separately, breaks the operator's own
            # model_wdt_mii_filter.py, which looks for ServerNamePrefix here.
            DynamicServers:
                ServerTemplate: 'wls-template'
                ServerNamePrefix: 'ms'
                DynamicClusterSize: '@@PROP:cluster.size@@'
                CalculatedListenPorts: false

    ServerTemplate:
        'wls-template':
            ListenPort: 7003
            ListenAddress: ''
            Cluster: '@@PROP:cluster.name@@'
            ServerStart:
                Arguments: '-Xms1024m -Xmx1536m'

    SecurityConfiguration:
        NodeManagerUsername: '@@SECRET:__weblogic-credentials__:username@@'
        NodeManagerPasswordEncrypted: '@@SECRET:__weblogic-credentials__:password@@'

appDeployments:
    # The application ships INSIDE the image, as a WDT archive entry.
    #
    # It used to be deployed at runtime instead: Ansible copied the WAR into
    # the AdminServer pod and ran WLST deploy(). That kept app changes off the
    # image-rebuild path, but it does not survive a pod restart. This is a
    # Model-in-Image domain (domainHomeSourceType: FromModel), so every pod
    # regenerates $DOMAIN_HOME from this model on every start -- a runtime
    # deployment lives only in that ephemeral domain home and in the running
    # JVM. Kill a managed-server pod and the replacement comes back with no
    # application at all; restart the AdminServer and even the config record
    # disappears (observed: domainConfig/appDeployments returned an empty list
    # while ms1/ms2 were still serving the app purely from memory).
    #
    # SourcePath is relative to the archive root, so 'wlsdeploy/applications/x'
    # resolves to the entry packer stages at /u01/wdt/models/archive.zip.
    Application:
        '@@PROP:app.name@@':
            SourcePath: 'wlsdeploy/applications/@@PROP:app.war@@'
            ModuleType: war
            Target: '@@PROP:cluster.name@@'
