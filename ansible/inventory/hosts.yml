---
# Static topology. Dynamic values (DB IP, generated passwords) come from the
# Terraform-generated fragments under terraform/*/.generated/ and are loaded by
# the playbooks, so nothing dynamic is hardcoded here.
all:
  children:
    # The host itself runs the socat LAN bridges, kubectl and the WAR build.
    control:
      hosts:
        localhost:
          ansible_connection: local

    # nginx reverse proxy on MicroCloud, reached over the LXD socket so we do
    # not depend on the guest's sshd.
    nginx:
      hosts:
        webserver:
          ansible_connection: community.general.lxd
          ansible_lxd_remote: local

    # Oracle XE on Multipass. ansible_host is injected at run time from
    # terraform/10-db-multipass/.generated/db_inventory.yaml
    db:
      hosts:
        oracle-db:
          ansible_user: ubuntu
