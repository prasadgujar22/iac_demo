---
# ===========================================================================
# Shared configuration for the homelab stack
# ===========================================================================

# --- Application -----------------------------------------------------------
app_name:         customer-onboarding
app_context_root: /customer-onboarding
app_repo:         https://github.com/prasadgujar22/java_session_management_demo.git
app_repo_version: main
# Per-user build directory. A shared /tmp path is owned by whoever ran first,
# so the next user (developer vs the jenkins CI account) hits
#   Destination /tmp/homelab-iac-build/src not writable
app_build_dir:    "/tmp/homelab-iac-build-{{ lookup('env', 'USER') | default('anon', true) }}"
app_war_name:     "{{ app_name }}.war"

app_login_username: admin
app_login_password: welcome1

# --- Database mode ---------------------------------------------------------
# oracle : Oracle XE on Multipass, shared by both managed servers
# h2     : embedded in-memory H2 - per-pod dataset, no external dependency
#
# H2 is a valid fallback but NOT equivalent: each managed server gets its own
# dataset, so a record written via ms1 is invisible to a session pinned to ms2.
db_mode: oracle

oracle_pdb:      XEPDB1
oracle_app_user: customer_app
oracle_listener_port: 1521

h2_jdbc_url: "jdbc:h2:mem:customer_onboarding;DB_CLOSE_DELAY=-1"
h2_user:     sa
h2_password: ""

# --- WebLogic --------------------------------------------------------------
wls_namespace:   wls-domain
wls_domain_uid:  wlsdomain
wls_domain_home: /u01/domains/wls_domain
wls_cluster_name: WLSCluster
wls_ms_listen_port: 7003
wls_admin_nodeport: 30070

# --- Networking ------------------------------------------------------------
# enp0s31f6 is the host's ONLY LAN path. Roles must only ever ADD secondary
# addresses to it and must never modify primary_ip.
primary_nic: enp0s31f6
primary_ip:  192.168.29.159

k8s_master_ip: 10.2.243.69

# Each managed server is published on its own LAN address so nginx can route by
# WebLogic JVM route ID for session affinity.
# Each managed server is reachable three ways:
#   nodeport            — direct on the k8s node; usable by anything on
#                         10.2.243.0/24, which now includes the nginx VM
#   lan_ip:lan_port     — published on the physical LAN by host socat bridges,
#                         for clients outside the Multipass network
#
# Since nginx moved from MicroCloud to Multipass it shares the k8s subnet, so
# it proxies to NodePorts DIRECTLY. Previously it had to hairpin out to the
# LAN and back through socat, because the OVN subnet could not reach 10.2.243.x.
k8s_node_ip: 10.2.243.69

managed_servers:
  - name: ms1
    nodeport: 30701
    lan_ip: 192.168.29.201
    lan_port: 8090
  - name: ms2
    nodeport: 30702
    lan_ip: 192.168.29.202
    lan_port: 8090

# --- nginx proxy -----------------------------------------------------------
proxy_lan_ip:      192.168.29.200
proxy_listen_port: 80
# proxy_internal_ip is deliberately NOT set here.
#
# It was hardcoded to the old MicroCloud VM (10.184.135.2) and silently survived
# the move to Multipass: the nginx host got the correct address from Terraform's
# generated inventory, but `control` — which builds the socat bridge — kept
# using this stale group_var and forwarded 192.168.29.200:80 to a VM that no
# longer exists. nginx answered fine internally while the LAN endpoint hung.
#
# The lan_bridge role now reads it from the nginx host's inventory facts, so it
# always follows the VM Terraform actually created.

# --- repository root --------------------------------------------------------
# Absolute path to this checkout. Derived from the inventory's own location so
# it is correct whether the repo sits in a developer's home directory or in a
# Jenkins job workspace — the two differ, and hardcoding either breaks the other.
repo_root: "{{ (inventory_dir | dirname) | dirname }}"

# --- proxy access log format -------------------------------------------------
# ONE definition, used twice: nginx's log_format directive writes it, and
# prometheus-nginxlog-exporter parses it. They must agree exactly -- a mismatch
# does not fail loudly, it silently produces parse errors and no latency data --
# so neither role is allowed its own copy.
#
# This is nginx's stock "combined" format plus rt=$request_time. That field is
# the whole point: stub_status exposes counts only, so request DURATION exists
# nowhere else, and without it no percentile can be computed at all.
#
# $upstream_response_time is deliberately NOT included. Requests nginx answers
# itself -- redirects, the health endpoint, 404s -- log it as "-", which the
# exporter cannot parse as a number, and every one of those lines would be
# dropped with a parse error.
nginx_log_format_name: wls_timed
nginx_log_format: '$remote_addr - $remote_user [$time_local] "$request" $status $body_bytes_sent "$http_referer" "$http_user_agent" rt=$request_time'
