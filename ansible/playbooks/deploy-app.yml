---
# Post-deployment wiring: refresh nginx routing and re-verify the running app.
#
# This no longer builds or deploys the application. The WAR ships inside the
# domain image (see packer/wls-domain-image and playbooks/build-app.yml), so
# rolling out an app change is: build-app.yml -> packer build -> terraform
# apply with the new image tag. What remains here is what must happen AFTER
# the domain is running the new image.
- name: Load database facts
  hosts: localhost
  connection: local
  gather_facts: false
  tags: [always]
  tasks:
    - name: Locate the database stack's generated inventory
      # playbook_dir is .../ansible/playbooks (the PLAYBOOK's directory, not the
      # ansible root), so the repo root is two levels up. Getting this wrong
      # makes stat report exists=false and the DB host silently stays empty.
      ansible.builtin.stat:
        path: "{{ playbook_dir }}/../../terraform/10-db-multipass/.generated/db_inventory.yaml"
      register: db_inv

    - name: Read the database stack's generated inventory
      # include_vars with `name:` nests the file under that key, so the data is
      # at db_tf.db.hosts - NOT db_tf.hosts. Read the file directly instead; it
      # is unambiguous and avoids that trap.
      ansible.builtin.set_fact:
        db_tf: "{{ lookup('ansible.builtin.file', db_inv.stat.path) | from_yaml }}"
      when: db_inv.stat.exists

    - name: Fall back to the shared Terraform state for the database host
      # The generated inventory only exists in the workspace that ran `apply`.
      # The app-redeploy job has its OWN workspace, so the file is absent there,
      # the host silently resolved to '', and the rendered JDBC URL pointed at
      # localhost — breaking a working deployment with
      #   ORA-12541: Cannot connect. No listener at host localhost port 1521
      #
      # The shared state backend is authoritative and visible to every job, so
      # query it whenever the inventory file is missing.
      ansible.builtin.shell:
        cmd: >-
          terraform -chdir={{ repo_root }}/terraform/10-db-multipass
          init -reconfigure -no-color -input=false >/dev/null 2>&1;
          terraform -chdir={{ repo_root }}/terraform/10-db-multipass
          output -raw db_host 2>/dev/null
        # `init` first: the app-redeploy workspace has never initialised this
        # stack, so `output` alone fails with "Backend initialization required".
        # -reconfigure because the shared backend is authoritative.
      register: db_host_tf
      changed_when: false
      failed_when: false
      when: not db_inv.stat.exists

    - name: Derive the database host from the Terraform-generated inventory
      # The expression must be self-guarding: Ansible finalizes set_fact args
      # BEFORE evaluating `when`, so a `when` guard does not prevent an
      # undefined-variable error inside the template.
      ansible.builtin.set_fact:
        oracle_db_host: >-
          {{ (db_tf | default({}, true))
             | community.general.json_query('db.hosts.*.ansible_host')
             | default([], true) | first
             | default(((db_host_tf | default({})).stdout | default('', true)) | trim, true)
             | default(oracle_db_host | default(''), true) }}

    - name: Require a usable database host in oracle mode
      # Never render a JDBC URL with an empty host: Jinja turns it into
      # localhost and the fault only surfaces later as ORA-12541, after the
      # deployment has already replaced a working WAR.
      ansible.builtin.assert:
        that:
          - oracle_db_host is defined
          - oracle_db_host | length > 0
          - oracle_db_host != 'localhost'
        fail_msg: >-
          No database host resolved (db_mode=oracle). Apply
          terraform/10-db-multipass first, or run with -e db_mode=h2.
        success_msg: "database host resolved: {{ oracle_db_host }}"
      when: (db_mode | default('oracle')) == 'oracle'

    # This host has no physical LAN (see site.yml for the full explanation) —
    # resolve the same overrides here since this playbook does not import
    # site.yml.
    - name: Read the k8s master IP from the k8s stack's shared Terraform state
      ansible.builtin.shell:
        cmd: >-
          terraform -chdir={{ repo_root }}/terraform/05-k8s-multipass
          init -reconfigure -no-color -input=false >/dev/null 2>&1;
          terraform -chdir={{ repo_root }}/terraform/05-k8s-multipass
          output -raw master_ip 2>/dev/null
      register: k8s_master_ip_tf
      changed_when: false
      failed_when: false

    - name: Resolve the k8s master IP for this environment
      ansible.builtin.set_fact:
        resolved_k8s_master_ip: "{{ (k8s_master_ip_tf.stdout | default('')) | trim }}"

    - name: Resolve the nginx proxy's Multipass IP for this environment
      ansible.builtin.set_fact:
        resolved_proxy_ip: >-
          {{ hostvars[groups['nginx'][0]]['proxy_internal_ip']
             | default(hostvars[groups['nginx'][0]]['ansible_host'])
             | default('') }}
      when: groups['nginx'] | default([]) | length > 0

- name: Resolve environment networking overrides (no physical LAN on this host)
  hosts: control:nginx
  gather_facts: false
  # tags: always, matching site.yml. Without it, `--tags verify` skips this
  # play and every check then runs against the stale group_vars defaults --
  # the original Linux homelab's 192.168.29.x LAN, which does not exist on
  # this host. That fails as a connection timeout to 192.168.29.200, looking
  # like the proxy is down rather than like a tag-selection problem.
  tags: [always]
  tasks:
    - name: Point k8s_node_ip/k8s_master_ip at the real Multipass master IP
      ansible.builtin.set_fact:
        k8s_node_ip: "{{ hostvars['localhost']['resolved_k8s_master_ip'] }}"
        k8s_master_ip: "{{ hostvars['localhost']['resolved_k8s_master_ip'] }}"
      when: hostvars['localhost']['resolved_k8s_master_ip'] | default('') | length > 0

    - name: Point proxy_lan_ip at the real Multipass nginx IP
      ansible.builtin.set_fact:
        proxy_lan_ip: "{{ hostvars['localhost']['resolved_proxy_ip'] }}"
      when: hostvars['localhost']['resolved_proxy_ip'] | default('') | length > 0

- name: Refresh nginx routing
  # Route IDs change whenever a JVM restarts -- a domain rebuild, a rolling
  # update, or verification's own failover check -- so the proxy must be
  # re-templated before anything asserts against its routing. Tagged verify so
  # `--tags verify` cannot skip it and assert against a stale map.
  hosts: nginx
  gather_facts: true
  tags: [verify, proxy, nginx]
  roles:
    - nginx_proxy

- name: Verify
  hosts: control
  gather_facts: false
  tags: [verify]
  roles:
    - verify

- name: Refresh nginx routing after verification
  # Verification deliberately kills a managed-server pod to prove session
  # failover, and the replacement JVM comes back with a NEW route id. nginx
  # pins sessions by route id, so leaving the map as it was silently breaks
  # affinity for that server -- for real users, not just for the next test
  # run: their sessions carry an id nginx no longer recognises, fall through
  # to the balanced pool, and land anywhere. Re-template the proxy against the
  # route ids that actually exist now.
  #
  # Tagged verify as well as proxy so it runs whenever verification runs,
  # including `--tags verify`, which is how the pipeline's Verify stage
  # invokes this playbook.
  hosts: nginx
  gather_facts: true
  tags: [verify, proxy, nginx]
  roles:
    - nginx_proxy
