---
# Full stack configuration. Terraform provisions; Ansible configures.
#
# Run order matters: the database must be reachable before the app serves
# traffic, the app must be running before nginx can discover JVM route IDs, and
# the LAN bridges must exist before anything can be probed.
#
# The application itself is NOT deployed here any more: it is baked into the
# domain image (Model-in-Image), so it is already running by the time this
# playbook executes. See playbooks/build-app.yml.

- name: Load Terraform outputs as facts
  hosts: localhost
  connection: local
  gather_facts: false
  tags: [always]
  tasks:
    - name: Locate the database stack's generated inventory
      # playbook_dir is .../ansible/playbooks (the PLAYBOOK's directory, not the
      # ansible root), so the repo root is two levels up. Getting this wrong
      # makes stat report exists=false and the DB host silently stays empty.
      ansible.builtin.stat:
        path: "{{ playbook_dir }}/../../terraform/10-db-multipass/.generated/db_inventory.yaml"
      register: db_inv

    - name: Read the database stack's generated inventory
      # include_vars with `name:` nests the file under that key, so the data is
      # at db_tf.db.hosts - NOT db_tf.hosts. Read the file directly instead; it
      # is unambiguous and avoids that trap.
      ansible.builtin.set_fact:
        db_tf: "{{ lookup('ansible.builtin.file', db_inv.stat.path) | from_yaml }}"
      when: db_inv.stat.exists

    - name: Read the database host from the stack's shared Terraform state
      # AUTHORITATIVE, and queried unconditionally -- NOT merely as a fallback
      # for a missing inventory file.
      #
      # The two sources have different lifetimes, and that is the whole point.
      # The 10-db stack's backend is a single absolute path shared by every
      # job, but `local_file.inventory` writes to ${path.module}/.generated/ --
      # RELATIVE to whichever workspace ran the command. So the homelab-teardown
      # job's `terraform destroy` empties the shared state (correct, globally)
      # while deleting only its OWN copy of the inventory: homelab-iac's copy
      # survives, still naming a VM that no longer exists. Preferring the file
      # therefore means confidently resolving a DEAD address, with the assert
      # below reporting success.
      #
      # Build #50 is the failure that shape produces. It templated
      # 192.168.252.28 -- a leftover from before the previous night's teardown
      # -- into the image's web.xml, while the rebuilt database had come up at
      # 192.168.252.36. Everything went green until Verify, where the dashboard
      # came back with ORA-17820.
      #
      # State is shared across workspaces, which is also the original reason
      # this lookup exists (the app-redeploy job has its own workspace, where
      # the inventory file has never existed at all). The generated inventory
      # stays on as the fallback for when state cannot be read.
      #
      # `init` first: a workspace that never initialised this stack fails with
      # "Backend initialization required" on `output` alone. -reconfigure
      # because the shared backend is authoritative.
      ansible.builtin.shell:
        cmd: >-
          terraform -chdir={{ repo_root }}/terraform/10-db-multipass
          init -reconfigure -no-color -input=false >/dev/null 2>&1;
          terraform -chdir={{ repo_root }}/terraform/10-db-multipass
          output -raw db_host 2>/dev/null
      register: db_host_tf
      changed_when: false
      failed_when: false
      when: db_mode == 'oracle'

    - name: Derive the database host, preferring Terraform state over the generated inventory
      # State first, inventory file second. The expression must be
      # self-guarding: Ansible finalizes set_fact args BEFORE evaluating
      # `when`, so a `when` guard does not prevent an undefined-variable
      # error inside the template.
      ansible.builtin.set_fact:
        oracle_db_host: >-
          {{ ((db_host_tf | default({})).stdout | default('', true) | trim)
             | default((db_tf | default({}, true))
                       | community.general.json_query('db.hosts.*.ansible_host')
                       | default([], true) | first | default('', true), true)
             | default(oracle_db_host | default(''), true) }}
      when: db_mode == 'oracle'

    - name: Require a database host when running in oracle mode
      ansible.builtin.assert:
        that:
          - oracle_db_host is defined
          - oracle_db_host | length > 0
          - oracle_db_host != 'localhost'
        fail_msg: >-
          db_mode=oracle but no database host is known. Apply
          terraform/10-db-multipass first, or run with -e db_mode=h2.
        success_msg: "database host resolved: {{ oracle_db_host }}"
      when: db_mode == 'oracle'

    # This host has no physical LAN (the upstream repo's 192.168.29.x /
    # 10.2.243.x addresses belong to the original Linux homelab box). The k8s
    # cluster and nginx proxy are reached directly at their Multipass IPs
    # instead, resolved here the same way oracle_db_host is above.
    - name: Read the k8s master IP from the k8s stack's shared Terraform state
      ansible.builtin.shell:
        cmd: >-
          terraform -chdir={{ repo_root }}/terraform/05-k8s-multipass
          init -reconfigure -no-color -input=false >/dev/null 2>&1;
          terraform -chdir={{ repo_root }}/terraform/05-k8s-multipass
          output -raw master_ip 2>/dev/null
      register: k8s_master_ip_tf
      changed_when: false
      failed_when: false

    - name: Resolve the k8s master IP for this environment
      ansible.builtin.set_fact:
        resolved_k8s_master_ip: "{{ (k8s_master_ip_tf.stdout | default('')) | trim }}"

    - name: Resolve the nginx proxy's Multipass IP for this environment
      # Mirrors the lan_bridge role's own lookup: prefer the Terraform-generated
      # proxy_internal_ip, fall back to the inventory's ansible_host.
      ansible.builtin.set_fact:
        resolved_proxy_ip: >-
          {{ hostvars[groups['nginx'][0]]['proxy_internal_ip']
             | default(hostvars[groups['nginx'][0]]['ansible_host'])
             | default('') }}
      when: groups['nginx'] | default([]) | length > 0

- name: Resolve environment networking overrides (no physical LAN on this host)
  hosts: control:nginx
  gather_facts: false
  tags: [always]
  tasks:
    - name: Point k8s_node_ip/k8s_master_ip at the real Multipass master IP
      ansible.builtin.set_fact:
        k8s_node_ip: "{{ hostvars['localhost']['resolved_k8s_master_ip'] }}"
        k8s_master_ip: "{{ hostvars['localhost']['resolved_k8s_master_ip'] }}"
      when: hostvars['localhost']['resolved_k8s_master_ip'] | default('') | length > 0

    - name: Point proxy_lan_ip at the real Multipass nginx IP
      ansible.builtin.set_fact:
        proxy_lan_ip: "{{ hostvars['localhost']['resolved_proxy_ip'] }}"
      when: hostvars['localhost']['resolved_proxy_ip'] | default('') | length > 0

- name: Configure the Oracle XE database tier
  hosts: db
  gather_facts: true
  tags: [db]
  roles:
    - role: oracle_xe
      when: db_mode == 'oracle'

- name: Publish managed servers on the LAN
  hosts: control
  gather_facts: true
  tags: [network, bridge]
  roles:
    # `control` is localhost here (no separate physical control-plane host on
    # this port), so primary_ip/primary_nic (the original Linux homelab's
    # physical LAN NIC) never resolve. lan_bridge's own precondition assert
    # would hard-fail rather than skip, so gate it here instead: run unchanged
    # on the real Linux host, no-op wherever that NIC doesn't exist. The app
    # is still reachable directly at nginx's Multipass IP either way.
    - role: lan_bridge
      when: primary_ip in (ansible_facts['all_ipv4_addresses'] | default([]))

- name: Configure the nginx reverse proxy
  hosts: nginx
  gather_facts: true
  # Deliberately NOT tagged verify. Adding that tag looked like a tidy way to
  # make `--tags verify` refresh routing, but it also made the Configure
  # stage's `--skip-tags verify` skip configuring nginx altogether -- the play
  # header printed with no tasks beneath it. The dedicated play below covers
  # the verify path instead.
  tags: [proxy, nginx]
  roles:
    - nginx_proxy

- name: Wait for the domain to settle before reading routing
  # MUST come before the routing refresh below. nginx pins sessions by JVM
  # route id, and the operator restarts servers one at a time, so a map
  # captured mid-roll records ids that are about to be replaced. Build #42
  # failed exactly that way: routing captured at 09:21:13, roll still running
  # until 09:27:56, distribution then collapsed onto one server.
  hosts: control
  gather_facts: false
  tags: [verify]
  roles:
    - domain_settled

- name: Refresh nginx routing before verification
  # Verification asserts on route-id affinity, so the map must describe the
  # JVMs running right now. `--tags verify` (how the Verify stage invokes this
  # playbook) skips the play above, and any JVM restart since it last ran -- a
  # rolling update, or a previous run's failover check -- leaves that server's
  # id stale. Its sessions then fall through to the balanced pool and
  # distribution collapses onto one server.
  hosts: nginx
  gather_facts: true
  tags: [verify]
  roles:
    - nginx_proxy

- name: Verify the whole stack end to end
  hosts: control
  gather_facts: false
  tags: [verify]
  roles:
    - verify

- name: Refresh nginx routing after verification
  # Verification deliberately kills a managed-server pod to prove session
  # failover, and the replacement JVM comes back with a NEW route id. nginx
  # pins sessions by route id, so leaving the map as it was silently breaks
  # affinity for that server -- for real users, not just for the next test
  # run: their sessions carry an id nginx no longer recognises, fall through
  # to the balanced pool, and land anywhere. Re-template the proxy against the
  # route ids that actually exist now.
  #
  # Tagged verify as well as proxy so it runs whenever verification runs,
  # including `--tags verify`, which is how the pipeline's Verify stage
  # invokes this playbook.
  hosts: nginx
  gather_facts: true
  tags: [verify, proxy, nginx]
  roles:
    - nginx_proxy
