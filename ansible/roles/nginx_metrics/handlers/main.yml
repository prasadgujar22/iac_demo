---
- name: reload nginx
  ansible.builtin.systemd:
    name: nginx
    state: reloaded
  become: true

- name: restart nginx_exporter
  ansible.builtin.systemd:
    name: nginx_exporter
    state: restarted
    daemon_reload: true
  become: true

- name: restart nginxlog_exporter
  ansible.builtin.systemd:
    name: nginxlog_exporter
    state: restarted
    daemon_reload: true
  become: true
