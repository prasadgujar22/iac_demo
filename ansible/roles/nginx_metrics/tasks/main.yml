---
# nginx's own metrics: active connections, accepted/handled/requests counters,
# and the reading/writing/waiting breakdown. Enough to see the proxy saturate
# or start dropping connections, which host metrics alone cannot show.
#
# Two pieces: stub_status inside nginx (off by default) and an exporter that
# translates it into Prometheus format.

- name: Remove the nginx metrics endpoint and exporter
  when: observability_state == 'absent'
  block:
    - name: Stop and disable nginx_exporter
      ansible.builtin.systemd:
        name: nginx_exporter
        state: stopped
        enabled: false
      become: true
      failed_when: false

    - name: Stop and disable the latency exporter
      ansible.builtin.systemd:
        name: nginxlog_exporter
        state: stopped
        enabled: false
      become: true
      failed_when: false

    - name: Remove exporter files
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      become: true
      loop:
        - /etc/systemd/system/nginx_exporter.service
        - "{{ nginx_exporter_bin }}"
        - /etc/systemd/system/nginxlog_exporter.service
        - "{{ nginxlog_exporter_bin }}"
        - "{{ nginxlog_exporter_config }}"
        - "{{ nginxlog_exporter_bin }}.version"
      # NOTE: the log_format itself is NOT removed. It lives in wls-proxy.conf,
      # owned by the nginx_proxy role, precisely so that removing monitoring
      # cannot leave that file referencing a format that no longer exists.

    - name: Reload systemd after removing the unit
      ansible.builtin.systemd:
        daemon_reload: true
      become: true

    # Removed LAST and validated: a broken conf.d file would take the whole
    # proxy down on the next reload, which would turn "tear down monitoring"
    # into "take down the application".
    - name: Remove the stub_status drop-in
      ansible.builtin.file:
        path: /etc/nginx/conf.d/stub_status.conf
        state: absent
      become: true
      register: stub_removed

    - name: Validate nginx configuration after removal
      ansible.builtin.command: nginx -t
      become: true
      changed_when: false
      when: stub_removed.changed

    - name: Reload nginx after removal
      ansible.builtin.systemd:
        name: nginx
        state: reloaded
      become: true
      when: stub_removed.changed

- name: Install the nginx metrics endpoint and exporter
  when: observability_state == 'present'
  block:
    - name: Install the stub_status drop-in
      ansible.builtin.template:
        src: stub_status.conf.j2
        dest: /etc/nginx/conf.d/stub_status.conf
        owner: root
        group: root
        mode: "0644"
        # nginx -t against the whole configuration, so a bad drop-in is
        # rejected before it can be loaded rather than after.
        validate: "bash -c 'cp %s /etc/nginx/conf.d/.stub_status.validate.conf && nginx -t; rc=$?; rm -f /etc/nginx/conf.d/.stub_status.validate.conf; exit $rc'"
      become: true
      notify: reload nginx

    # The drop-in must be live before the exporter starts, or its first scrapes
    # fail and the unit backs off while nginx is already serving the endpoint.
    - name: Apply pending nginx reload now
      ansible.builtin.meta: flush_handlers

    - name: Map the machine architecture to a release architecture
      ansible.builtin.set_fact:
        nginx_exporter_arch: >-
          {{ {'aarch64': 'arm64', 'arm64': 'arm64',
              'x86_64': 'amd64', 'amd64': 'amd64'}[ansible_facts['architecture']] }}

    - name: Check the installed exporter version
      ansible.builtin.command: "{{ nginx_exporter_bin }} --version"
      register: nex_installed
      changed_when: false
      failed_when: false

    # stdout AND stderr: this exporter prints its version banner on STDERR
    # (node_exporter prints the same banner on stdout). Checking only stdout
    # never matched, so every deploy re-downloaded a binary that was already
    # installed and restarted a healthy exporter to replace it with itself.
    - name: Install the nginx exporter binary
      when: nginx_exporter_version not in ((nex_installed.stdout | default('')) ~ (nex_installed.stderr | default(''))) 
      become: true
      block:
        - name: Download the nginx exporter release
          ansible.builtin.get_url:
            url: >-
              {{ nginx_exporter_base_url }}/v{{ nginx_exporter_version }}/nginx-prometheus-exporter_{{ nginx_exporter_version }}_linux_{{ nginx_exporter_arch }}.tar.gz
            dest: /tmp/nginx_exporter.tar.gz
            mode: "0644"
            timeout: 60

        - name: Unpack the exporter binary
          ansible.builtin.unarchive:
            src: /tmp/nginx_exporter.tar.gz
            dest: /usr/local/bin
            remote_src: true
            extra_opts:
              - nginx-prometheus-exporter
            owner: root
            group: root
            mode: "0755"
          notify: restart nginx_exporter

        - name: Remove the downloaded archive
          ansible.builtin.file:
            path: /tmp/nginx_exporter.tar.gz
            state: absent

    - name: Create the exporter system user
      ansible.builtin.user:
        name: "{{ nginx_exporter_user }}"
        system: true
        shell: /usr/sbin/nologin
        create_home: false
      become: true

    - name: Install the exporter unit
      ansible.builtin.template:
        src: nginx_exporter.service.j2
        dest: /etc/systemd/system/nginx_exporter.service
        owner: root
        group: root
        mode: "0644"
      become: true
      notify: restart nginx_exporter

    - name: Enable and start the exporter
      ansible.builtin.systemd:
        name: nginx_exporter
        state: started
        enabled: true
        daemon_reload: true
      become: true

    # nginx_up is the exporter's own verdict on whether it could read
    # stub_status. A 200 from /metrics with nginx_up 0 means the exporter is
    # healthy and the endpoint is not -- the failure this check exists to catch.
    - name: Verify the exporter is reading stub_status
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ nginx_exporter_port }}/metrics"
        return_content: true
        status_code: 200
      register: nex_probe
      retries: 6
      delay: 5
      until:
        - nex_probe is succeeded
        - "'nginx_up 1' in nex_probe.content"

    # ---- request latency ----------------------------------------------------
    # A second exporter, reading the access log, because stub_status carries no
    # timing at all. This is what makes p99 possible.

    # The timed log_format lives in wls-proxy.conf, which belongs to the
    # nginx_proxy role and is written by homelab-iac -- NOT by this pipeline.
    # That separation is deliberate: monitoring must not depend on the
    # monitored application being healthy, and running nginx_proxy here would
    # make an observability deploy fail whenever WebLogic was down.
    #
    # The cost is this ordering dependency, so state it plainly instead of
    # letting it surface as an exporter that parses nothing.
    - name: Check the proxy is logging request times
      ansible.builtin.command: "grep -q 'access_log .*{{ nginx_log_format_name }}' /etc/nginx/sites-available/wls-proxy.conf"
      become: true
      register: fmt_check
      changed_when: false
      failed_when: false

    - name: Fail with the fix when the proxy is not logging request times
      ansible.builtin.fail:
        msg: >-
          {{ inventory_hostname }} is still writing its access log in nginx's
          default format, which carries no $request_time, so no latency can be
          measured. The timed format ships in wls-proxy.conf via the
          nginx_proxy role: run the homelab-iac pipeline (its Configure stage
          re-templates the proxy), then re-run this one.
      when: fmt_check.rc != 0

    # Guarded by a stamp file rather than `--version` output: the flag and the
    # stream it prints on differ between exporters (node_exporter uses stdout,
    # the stub_status exporter stderr), and a guard that never matches silently
    # re-downloads on every run forever.
    - name: Check which latency exporter version is installed
      ansible.builtin.slurp:
        src: "{{ nginxlog_exporter_bin }}.version"
      become: true
      register: nlex_stamp
      failed_when: false

    - name: Install the latency exporter binary
      when: (nlex_stamp.content | default('') | b64decode | trim) != nginxlog_exporter_version
      become: true
      block:
        - name: Download the latency exporter release
          ansible.builtin.get_url:
            url: >-
              {{ nginxlog_exporter_base_url }}/v{{ nginxlog_exporter_version }}/prometheus-nginxlog-exporter_{{ nginxlog_exporter_version }}_linux_{{ nginx_exporter_arch }}.tar.gz
            dest: /tmp/nginxlog_exporter.tar.gz
            mode: "0644"
            timeout: 60

        - name: Unpack the release
          ansible.builtin.unarchive:
            src: /tmp/nginxlog_exporter.tar.gz
            dest: /tmp
            remote_src: true
            list_files: true
          register: nlex_unpacked

        # The archive's internal layout is not guaranteed across releases, so
        # find the binary rather than assuming a path that a later version may
        # move.
        - name: Locate the unpacked binary
          ansible.builtin.find:
            paths: /tmp
            patterns: prometheus-nginxlog-exporter
            recurse: true
            file_type: file
          register: nlex_found

        - name: Fail clearly if the archive layout changed
          ansible.builtin.fail:
            msg: >-
              prometheus-nginxlog-exporter was not found in the extracted
              archive. Files: {{ nlex_unpacked.files | default([]) | join(', ') }}
          when: nlex_found.files | length == 0

        - name: Install the binary
          ansible.builtin.copy:
            src: "{{ nlex_found.files[0].path }}"
            dest: "{{ nginxlog_exporter_bin }}"
            remote_src: true
            owner: root
            group: root
            mode: "0755"
          notify: restart nginxlog_exporter

        - name: Record the installed version
          ansible.builtin.copy:
            content: "{{ nginxlog_exporter_version }}\n"
            dest: "{{ nginxlog_exporter_bin }}.version"
            owner: root
            group: root
            mode: "0644"

        - name: Clean up the download
          ansible.builtin.file:
            path: "{{ item }}"
            state: absent
          loop:
            - /tmp/nginxlog_exporter.tar.gz

    - name: Install the latency exporter configuration
      ansible.builtin.template:
        src: nginxlog-exporter.yml.j2
        dest: "{{ nginxlog_exporter_config }}"
        owner: root
        group: root
        mode: "0644"
      become: true
      notify: restart nginxlog_exporter

    - name: Install the latency exporter unit
      ansible.builtin.template:
        src: nginxlog_exporter.service.j2
        dest: /etc/systemd/system/nginxlog_exporter.service
        owner: root
        group: root
        mode: "0644"
      become: true
      notify: restart nginxlog_exporter

    - name: Enable and start the latency exporter
      ansible.builtin.systemd:
        name: nginxlog_exporter
        state: started
        enabled: true
        daemon_reload: true
      become: true

    - name: Apply any pending restart before probing
      ansible.builtin.meta: flush_handlers

    # A histogram with no observations exposes no buckets at all, so a fresh
    # exporter looks identical to a broken one. Generate a request first, then
    # assert the buckets exist -- that proves the whole path: nginx wrote a
    # timed line, the exporter parsed it, and the metric is being served.
    - name: Generate a request so there is something to measure
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ proxy_listen_port | default(80) }}/proxy-health"
        status_code: [200, 404]
      retries: 3
      delay: 2

    - name: Verify request timings are being parsed
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ nginxlog_exporter_port }}/metrics"
        return_content: true
        status_code: 200
      register: nlex_probe
      retries: 10
      delay: 3
      until:
        - nlex_probe is succeeded
        - "'nginx_http_response_time_seconds_bucket' in nlex_probe.content"

    # Parse errors mean the log_format and the exporter's format disagree --
    # the one failure mode this design is most exposed to, and it produces an
    # exporter that is up, serving, and reporting nothing.
    - name: Warn if any log lines failed to parse
      ansible.builtin.debug:
        msg: >-
          WARNING: the latency exporter reported parse errors. The log_format in
          wls-proxy.conf and nginx_log_format in group_vars/all.yml have
          diverged.
      when: "'nginx_parse_errors_total 0' not in nlex_probe.content"
