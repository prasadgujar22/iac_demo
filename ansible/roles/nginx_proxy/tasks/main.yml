---
# Configure nginx as a reverse proxy for the WebLogic cluster with session
# affinity based on the WebLogic JVM route ID.
#
# Route IDs are DISCOVERED at run time, never hardcoded: they change whenever a
# managed server is renamed or the domain is rebuilt. Hardcoding them causes
# logins to silently bounce back to the login page after the next rebuild.

- name: Discover the JVM route ID of each managed server
  # WebLogic embeds the owning server's JVM ID in the session cookie:
  #   JSESSIONID=<sessionid>!<primaryJVMID>[!<secondaryJVMID>]
  #
  # Probed via the NodePort, which is what nginx itself will proxy to now that
  # it shares the 10.2.243.0/24 subnet with the k8s nodes. Probing a different
  # path than the one nginx uses would risk discovering IDs that do not match.
  ansible.builtin.uri:
    url: "http://{{ k8s_node_ip }}:{{ item.nodeport }}{{ app_context_root }}/login"
    method: GET
    return_content: false
    status_code: [200, 302]
    timeout: 15
  register: route_probe
  retries: 10
  delay: 6
  until: route_probe is succeeded
  loop: "{{ managed_servers }}"
  loop_control:
    label: "{{ item.name }}"
  delegate_to: localhost
  become: false
  changed_when: false

- name: Extract route IDs from the Set-Cookie headers
  # The uri module exposes the header as `set_cookie` on some versions and only
  # inside `cookies_string` on others, so check both. regex_search returns None
  # when nothing matches and `| first` then explodes with
  #   'NoneType' object has no attribute 'group'
  # hence the explicit default('') before any further filtering.
  ansible.builtin.set_fact:
    wls_routes: >-
      {{ wls_routes | default([]) + [{
        'name':     item.item.name,
        'lan_ip':   k8s_node_ip,
        'lan_port': item.item.nodeport,
        'route_id': ((item.set_cookie | default(item.cookies_string | default('')))
                     | regex_search('![-0-9]+') | default('', true))
      }] }}
  loop: "{{ route_probe.results }}"
  loop_control:
    label: "{{ item.item.name }}"

- name: Fail if any route ID could not be determined
  # Proceeding without a route ID would silently break session affinity.
  ansible.builtin.assert:
    that:
      - item.route_id | length > 1
    fail_msg: >-
      Could not read the JVM route ID for {{ item.name }}. Is the application
      deployed and the managed server in RUNNING (not ADMIN) mode?
    success_msg: "{{ item.name }} route ID = {{ item.route_id }}"
  loop: "{{ wls_routes }}"
  loop_control:
    label: "{{ item.name }}"

- name: Ensure nginx is installed
  ansible.builtin.apt:
    name: nginx
    state: present
    update_cache: true
    cache_valid_time: 3600
  become: true

- name: Remove the distro default site
  # It also claims default_server on :80 and would shadow the proxy vhost.
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  become: true
  notify: reload nginx

- name: Deploy the reverse proxy configuration
  ansible.builtin.template:
    src: wls-proxy.conf.j2
    dest: /etc/nginx/sites-available/wls-proxy.conf
    owner: root
    group: root
    mode: "0644"
    # No `validate:` here. Ansible requires a %s placeholder for the temp file,
    # but this is a site FRAGMENT — its server{} block is only legal inside the
    # http{} context of the main config, so `nginx -t -c <fragment>` fails even
    # when the fragment is perfectly correct. Validation happens in the next
    # task, through the main config that includes it.
  become: true
  notify: reload nginx

- name: Enable the reverse proxy site
  ansible.builtin.file:
    src: /etc/nginx/sites-available/wls-proxy.conf
    dest: /etc/nginx/sites-enabled/wls-proxy.conf
    state: link
  become: true
  notify: reload nginx

- name: Remove the default site
  # Its catch-all server block would otherwise answer on port 80 ahead of ours.
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  become: true
  notify: reload nginx

- name: Validate the full nginx configuration
  # Run AFTER the fragment is linked in, so the server{} block is checked in its
  # real http{} context. Failing here stops a broken config reaching a reload.
  ansible.builtin.command:
    cmd: nginx -t
  become: true
  changed_when: false

- name: Ensure nginx is enabled and running
  ansible.builtin.systemd:
    name: nginx
    enabled: true
    state: started
  become: true

- name: Flush handlers so the proxy is live before verification
  ansible.builtin.meta: flush_handlers
