---
# End-to-end verification. Every assertion is a real HTTP interaction against
# live infrastructure -- nothing is inferred from "the deploy command exited 0".

- name: Proxy health endpoint responds
  ansible.builtin.uri:
    url: "http://{{ proxy_lan_ip }}:{{ proxy_listen_port }}/proxy-health"
    return_content: true
    timeout: 10
  register: health
  retries: 6
  delay: 5
  until: health is succeeded
  failed_when: "'OK' not in health.content"
  changed_when: false

- name: Each managed server serves the login page directly
  # This host has no physical LAN bridge, so managed servers are reached
  # directly at their k8s NodePort (k8s_node_ip:nodeport) instead of the
  # upstream repo's item.lan_ip:lan_port (a socat-published LAN address that
  # does not exist here).
  ansible.builtin.uri:
    url: "http://{{ k8s_node_ip }}:{{ item.nodeport }}{{ app_context_root }}/login"
    return_content: true
    timeout: 15
  register: direct
  failed_when: "'Customer Onboarding' not in direct.content"
  loop: "{{ managed_servers }}"
  loop_control:
    label: "{{ item.name }}"
  changed_when: false

- name: Login page is served through the proxy
  ansible.builtin.uri:
    url: "http://{{ proxy_lan_ip }}:{{ proxy_listen_port }}{{ app_context_root }}/login"
    return_content: true
    timeout: 15
  register: proxy_login
  failed_when: "'Customer Onboarding' not in proxy_login.content"
  changed_when: false

- name: Dashboard renders without a database error banner
  # A dashboard can return HTTP 200 while displaying "Database connection issue"
  # in the body, so the status code alone proves nothing.
  ansible.builtin.shell:
    cmd: |
      set -uo pipefail
      J=$(mktemp)
      BASE="http://{{ proxy_lan_ip }}:{{ proxy_listen_port }}{{ app_context_root }}"
      curl -s -m 15 -c "$J" -o /dev/null "$BASE/login"
      curl -s -m 15 -b "$J" -c "$J" -o /dev/null -X POST \
        -d "username={{ app_login_username }}&password={{ app_login_password }}" "$BASE/login"
      BODY=$(curl -s -m 20 -b "$J" "$BASE/dashboard")
      rm -f "$J"
      if echo "$BODY" | grep -qi "Database connection issue"; then
        echo "FAIL: database error banner present"
        echo "$BODY" | grep -io "Database connection issue[^<]*" | head -1
        exit 1
      fi
      echo "$BODY" | grep -q "Customer Onboarding Dashboard" || { echo "FAIL: dashboard did not render"; exit 1; }
      echo "PASS: dashboard clean"
  register: dash
  changed_when: false

- name: Session affinity holds across the login handover
  # THE test that catches broken affinity. A single manual login can pass by
  # luck; the failure mode is that the backend CHANGES between the GET and the
  # POST, so the session created on one server is unknown to the other and the
  # user is bounced back to the login page. Repeat to expose it.
  ansible.builtin.shell:
    cmd: |
      set -uo pipefail
      BASE="http://{{ proxy_lan_ip }}:{{ proxy_listen_port }}{{ app_context_root }}"
      FAIL=0
      for i in $(seq 1 {{ verify_affinity_iterations }}); do
        J=$(mktemp)
        A=$(curl -s -D - -o /dev/null -m 15 -c "$J" "$BASE/login" \
            | grep -i X-Upstream-Server | tr -d '\r' | awk '{print $2}')
        B=$(curl -s -D - -o /dev/null -m 15 -b "$J" -c "$J" -X POST \
            -d "username={{ app_login_username }}&password={{ app_login_password }}" "$BASE/login" \
            | grep -i X-Upstream-Server | tr -d '\r' | awk '{print $2}')
        LOC=$(curl -s -D - -o /dev/null -m 15 -b "$J" "$BASE/dashboard" \
            | grep -i "^Location" | tr -d '\r' | awk '{print $2}')
        rm -f "$J"
        if [ -n "$LOC" ]; then
          echo "iteration $i: BOUNCED to login (get=$A post=$B)"
          FAIL=$((FAIL+1))
        fi
      done
      if [ "$FAIL" -gt 0 ]; then
        echo "FAIL: $FAIL of {{ verify_affinity_iterations }} logins bounced - affinity is broken"
        exit 1
      fi
      echo "PASS: 0 of {{ verify_affinity_iterations }} logins bounced"
  register: affinity
  changed_when: false

- name: New sessions are distributed across managed servers
  # Affinity must not collapse into pinning everything to one server.
  ansible.builtin.shell:
    cmd: |
      set -uo pipefail
      BASE="http://{{ proxy_lan_ip }}:{{ proxy_listen_port }}{{ app_context_root }}"
      for i in $(seq 1 {{ verify_distribution_iterations }}); do
        J=$(mktemp)
        curl -s -m 12 -c "$J" -o /dev/null "$BASE/login"
        curl -s -D - -o /dev/null -m 12 -b "$J" "$BASE/login" \
          | grep -i X-Upstream-Server | tr -d '\r' | awk '{print $2}'
        rm -f "$J"
      done | sort | uniq -c | tee /tmp/dist.txt
      SERVERS=$(wc -l < /tmp/dist.txt)
      rm -f /tmp/dist.txt
      if [ "$SERVERS" -lt 2 ]; then
        echo "FAIL: all new sessions landed on one server"
        exit 1
      fi
      echo "PASS: sessions spread across $SERVERS servers"
  register: distribution
  changed_when: false

- name: Write-then-read round trip through the proxy
  # The only way to prove the database path actually works end to end.
  ansible.builtin.shell:
    cmd: |
      set -uo pipefail
      BASE="http://{{ proxy_lan_ip }}:{{ proxy_listen_port }}{{ app_context_root }}"
      MARKER="IaC-Verify-{{ 999999 | random }}"
      J=$(mktemp)
      curl -s -m 15 -c "$J" -o /dev/null "$BASE/login"
      curl -s -m 15 -b "$J" -c "$J" -o /dev/null -X POST \
        -d "username={{ app_login_username }}&password={{ app_login_password }}" "$BASE/login"
      curl -s -m 20 -b "$J" -c "$J" -o /dev/null -X POST "$BASE/customers" \
        --data-urlencode "customerName=$MARKER" \
        --data-urlencode "companyName=IaC Pipeline" \
        --data-urlencode "email=verify@example.com" \
        --data-urlencode "onboardingStatus=SUBMITTED" \
        --data-urlencode "country=USA"
      OUT=$(curl -s -m 20 -b "$J" "$BASE/dashboard?tab=reports")
      rm -f "$J"
      if echo "$OUT" | grep -q "$MARKER"; then
        echo "PASS: wrote and read back $MARKER"
      else
        echo "FAIL: $MARKER not found after write"
        exit 1
      fi
  register: roundtrip
  changed_when: false

- name: Session survives losing the pod that owns it
  # The point of replicated_if_clustered. Every check above proves affinity --
  # that a session STAYS on one server. This proves the opposite case: that it
  # SURVIVES that server disappearing.
  #
  # Deliberately destructive: it deletes a managed-server pod and waits for the
  # replacement. Set verify_session_failover=false to skip it.
  when: verify_session_failover | default(true) | bool
  ansible.builtin.shell:
    cmd: |
      set -uo pipefail
      BASE="http://{{ proxy_lan_ip }}:{{ proxy_listen_port }}{{ app_context_root }}"
      NS="{{ wls_namespace }}"
      # "name:nodeport" per managed server, so the shell can loop over them
      # without Jinja block tags inside this script.
      PAIRS="{% for ms in managed_servers %}{{ ms.name }}:{{ ms.nodeport }} {% endfor %}"
      NODE="{{ k8s_node_ip }}"
      J=$(mktemp)
      trap 'rm -f "$J"' EXIT

      # 0. Never start while the operator is still rolling. Verify often runs
      #    right after an apply that changed the image or serverPod env, and a
      #    roll recreates these very pods -- killing one mid-roll makes the
      #    replacement queue behind the operator's own restarts and blows the
      #    readiness deadline below for reasons that have nothing to do with
      #    session replication. (Observed exactly this in build #37.)
      for i in $(seq 1 60); do
        ROLLING=$(kubectl -n "$NS" get domain {{ wls_domain_uid }} \
                  -o jsonpath='{.status.conditions[?(@.type=="Rolling")].status}' 2>/dev/null)
        [ "$ROLLING" = "True" ] || break
        [ "$i" = "1" ] && echo "domain is rolling; waiting for it to settle before the failover test"
        sleep 10
      done

      # 1. Establish a logged-in session through the proxy.
      curl -s -m 15 -c "$J" -o /dev/null "$BASE/login"
      curl -s -m 15 -b "$J" -c "$J" -o /dev/null -X POST \
        -d "username={{ app_login_username }}&password={{ app_login_password }}" "$BASE/login"
      if ! curl -s -m 20 -b "$J" "$BASE/dashboard" | grep -q "Customer Onboarding Dashboard"; then
        echo "FAIL: could not establish a logged-in session to begin with"
        exit 1
      fi

      SID=$(awk '$6 == "JSESSIONID" {print $7}' "$J")
      if [ -z "$SID" ]; then echo "FAIL: no JSESSIONID cookie"; exit 1; fi

      # 2. A replicated session carries BOTH a primary and a secondary JVM id
      #    (id!primary!secondary). Only a primary means replication is off: the
      #    session would die with its server. Fail here rather than after the
      #    kill, where the same symptom would look like a failover bug.
      PRIMARY=$(echo "$SID"   | awk -F'!' '{print $2}')
      SECONDARY=$(echo "$SID" | awk -F'!' '{print $3}')
      if [ -z "$PRIMARY" ] || [ -z "$SECONDARY" ]; then
        echo "FAIL: session is not replicated (cookie=$SID)"
        echo "      expected id!primaryJVMID!secondaryJVMID -- check that weblogic.xml"
        echo "      sets persistent-store-type replicated_if_clustered"
        exit 1
      fi
      echo "session replicated: primary=$PRIMARY secondary=$SECONDARY"

      # 3. Identify which server owns the primary, reading each server's own
      #    route id exactly the way the nginx role discovers them.
      #    Parse the cookie by FIELD, not with a regex searching the whole
      #    string: JSESSIONID is <id>!<primary>!<secondary>, and a greedy
      #    ".*JSESSIONID=[^;]*!\([-0-9]*\)" backtracks to the LAST '!' and
      #    therefore returns the SECONDARY id. That silently identifies the
      #    peer instead of the owner, so the test would kill the pod holding
      #    the replica -- passing while proving something much weaker than it
      #    claims -- or, when the ids line up differently, match nothing at all
      #    ("no managed server claims route id", build #38).
      OWNER=""; OPORT=""; PROBED=""
      for pair in $PAIRS; do
        n="${pair%%:*}"; p="${pair##*:}"
        RID=$(curl -s -i -m 15 "http://$NODE:$p{{ app_context_root }}/login" \
              | tr -d '\r' \
              | sed -n 's/^[Ss]et-[Cc]ookie: JSESSIONID=\([^;]*\).*/\1/p' \
              | head -1 | awk -F'!' '{print $2}')
        PROBED="$PROBED $n=${RID:-none}"
        if [ -n "$RID" ] && [ "$RID" = "$PRIMARY" ]; then OWNER="$n"; OPORT="$p"; fi
      done
      if [ -z "$OWNER" ]; then
        echo "FAIL: no managed server claims route id $PRIMARY"
        echo "      probed primaries:$PROBED"
        exit 1
      fi
      POD="{{ wls_domain_uid }}-$OWNER"
      echo "primary session owner: $OWNER (pod $POD)"

      # 4. Kill it.
      kubectl -n "$NS" delete pod "$POD" --wait=false >/dev/null 2>&1 || {
        echo "FAIL: could not delete $POD"; exit 1; }
      for i in $(seq 1 30); do
        READY=$(kubectl -n "$NS" get pod "$POD" -o jsonpath='{.status.containerStatuses[0].ready}' 2>/dev/null)
        [ "$READY" = "true" ] || break
        sleep 2
      done
      echo "$POD is down"

      # 5. The session must still be alive on the peer holding the replica.
      #    nginx needs max_fails failures before it marks the dead upstream
      #    down, so the first attempt may legitimately fail: retry briefly.
      OK=0
      for i in $(seq 1 15); do
        if curl -s -m 20 -b "$J" "$BASE/dashboard" | grep -q "Customer Onboarding Dashboard"; then
          OK=1; break
        fi
        sleep 4
      done
      if [ "$OK" -ne 1 ]; then
        echo "FAIL: session did not survive the loss of $OWNER"
        echo "      (the same JSESSIONID no longer renders the dashboard)"
        exit 1
      fi
      echo "PASS: session survived losing $OWNER"

      # 6. The replacement pod must come back WITH the application. That is
      #    what baking the WAR into the image buys; a runtime-deployed app
      #    comes back empty here.
      # `kubectl wait` is wrong here: between the delete and the operator
      # recreating the pod there is a window where the object does not exist,
      # and `kubectl wait` does not wait for it to appear -- it returns
      # "Error from server (NotFound)" immediately (measured: 0.04s), which
      # reads as "the pod never came back". Poll instead, tolerating NotFound.
      BACK=0
      for i in $(seq 1 60); do
        R=$(kubectl -n "$NS" get pod "$POD" \
            -o jsonpath='{.status.containerStatuses[0].ready}' 2>/dev/null)
        if [ "$R" = "true" ]; then BACK=1; break; fi
        sleep 5
      done
      if [ "$BACK" -ne 1 ]; then
        echo "FAIL: $POD did not become Ready again within 300s"
        kubectl -n "$NS" get pod "$POD" -o wide 2>&1 | tail -2
        exit 1
      fi
      RC=""
      for i in $(seq 1 20); do
        RC=$(curl -s -o /dev/null -m 15 -w '%{http_code}' "http://$NODE:$OPORT{{ app_context_root }}/login")
        [ "$RC" = "200" ] && break
        sleep 5
      done
      if [ "$RC" != "200" ]; then
        echo "FAIL: $OWNER came back without the application (HTTP $RC)"
        echo "      the WAR must be baked into the domain image, not deployed at runtime"
        exit 1
      fi
      echo "PASS: $OWNER came back serving the application from the image"
  register: failover
  changed_when: false


- name: Verification summary
  ansible.builtin.debug:
    msg:
      - "proxy health ......... {{ 'PASS' if health is succeeded else 'FAIL' }}"
      - "direct endpoints ..... PASS ({{ managed_servers | length }} servers)"
      - "proxy login page ..... PASS"
      - "dashboard clean ...... {{ dash.stdout_lines | last }}"
      - "session affinity ..... {{ affinity.stdout_lines | last }}"
      - "distribution ......... {{ distribution.stdout_lines | last }}"
      - "write/read round trip  {{ roundtrip.stdout_lines | last }}"
      - "session failover ..... {{ failover.stdout_lines | last if failover is not skipped else 'SKIPPED' }}"
      - ""
      - "APPLICATION URL: http://{{ proxy_lan_ip }}:{{ proxy_listen_port }}{{ app_context_root }}/login"
