---
# Contract with the rest of the stack. These values determine the JDBC URL that
# the application's web.xml is rendered with, so they must not drift.
oracle_pdb: XEPDB1
oracle_listener_port: 1521
oracle_app_user: customer_app

# Container runtime settings.
#
# oracle-free rather than oracle-xe: gvenzl publishes oracle-xe as amd64 only.
# On an Apple Silicon host the Multipass VM is arm64, and running amd64 XE
# under QEMU user-mode emulation crashes the emulator itself
# ("QEMU internal SIGSEGV") rather than the database — this is a nested
# virtualization limit (macOS -> arm64 VM -> qemu-user -> amd64), not something
# fixable by retrying. oracle-free publishes a native arm64 image and gvenzl
# maintains the same env-var contract (APP_USER/APP_USER_PASSWORD), so only the
# image and the PDB name (ORACLE_DATABASE, else oracle-free defaults to
# FREEPDB1) need to change — the JDBC URL shape is otherwise unchanged.
oracle_xe_image: gvenzl/oracle-free:23-slim
oracle_container_name: oracle-xe

# Bind-mounted datafiles, so the database survives container recreation.
# Must be owned by uid 54321 (the `oracle` user inside the image).
oracle_data_dir: /opt/oracle-data
