---
# Oracle XE 21c as a container on the database VM.
#
# WHY A CONTAINER, NOT A NATIVE INSTALL
# Oracle ships XE as an RPM only. Converting it for Ubuntu with `alien` failed
# four times across three distinct root causes:
#   1. alien exits non-zero on SUCCESS (rpm NOKEY signature warnings propagate)
#   2. Ubuntu 24.04 ships libaio.so.1t64; Oracle links the historic libaio.so.1
#   3. netca rejects Ubuntu's 127.0.1.1 hostname mapping
# and then DBCA still failed with DBT-05509 inside its CVU prerequisite
# machinery. Each retry cost ~40 minutes (2.2GB download + ~35min conversion).
#
# gvenzl/oracle-xe is the image Oracle's own developer advocate maintains for
# exactly this purpose. It starts in minutes, needs no conversion, and creates
# the application user itself.
#
# The JDBC contract is IDENTICAL, so nothing downstream changes:
#   jdbc:oracle:thin:@//<vm-ip>:1521/XEPDB1

- name: Install Docker on the database VM
  ansible.builtin.apt:
    name:
      - docker.io
      - python3-docker
    state: present
    update_cache: true
    cache_valid_time: 3600
  become: true
  register: docker_install
  retries: 3
  delay: 10
  until: docker_install is succeeded

- name: Ensure Docker is running
  ansible.builtin.systemd:
    name: docker
    state: started
    enabled: true
  become: true

- name: Create the datafile directory
  # Bind-mounted so the database survives container replacement. uid 54321 is
  # the `oracle` user inside the image; without this ownership the container
  # cannot write its datafiles and exits during initialisation.
  ansible.builtin.file:
    path: "{{ oracle_data_dir }}"
    state: directory
    owner: "54321"
    group: "54321"
    mode: "0755"
  become: true

- name: Pull the Oracle XE image
  community.docker.docker_image:
    name: "{{ oracle_xe_image }}"
    source: pull
    state: present
  become: true
  register: xe_pull
  retries: 2
  delay: 15
  until: xe_pull is succeeded

- name: Run the Oracle XE container
  # APP_USER/APP_USER_PASSWORD make the image create the application schema in
  # XEPDB1 on first boot, which replaces the hand-written SQL the native install
  # needed. Published on 0.0.0.0 so WebLogic pods on 10.2.243.0/24 can reach it.
  community.docker.docker_container:
    name: "{{ oracle_container_name }}"
    image: "{{ oracle_xe_image }}"
    state: started
    restart_policy: unless-stopped
    published_ports:
      - "0.0.0.0:{{ oracle_listener_port }}:1521"
    env:
      ORACLE_PASSWORD: "{{ oracle_sys_password }}"
      APP_USER: "{{ oracle_app_user }}"
      APP_USER_PASSWORD: "{{ oracle_app_password }}"
    volumes:
      - "{{ oracle_data_dir }}:/opt/oracle/oradata"
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 20
  become: true
  no_log: true          # never leak the SYS or app password

- name: Wait for the database to finish initialising
  # First boot creates the datafiles and can take several minutes; subsequent
  # starts are quick because the bind mount persists them. The image prints this
  # banner only when the listener is up AND the PDB is open for business.
  ansible.builtin.shell:
    cmd: docker logs {{ oracle_container_name }} 2>&1 | grep -c 'DATABASE IS READY TO USE'
  become: true
  register: xe_ready
  changed_when: false
  retries: 60
  delay: 15
  until: xe_ready.stdout | int > 0

- name: Verify the listener accepts TCP connections
  ansible.builtin.wait_for:
    host: "{{ ansible_default_ipv4.address }}"
    port: "{{ oracle_listener_port }}"
    timeout: 60
  become: true

- name: Confirm the application user can actually log in
  # Proves the credential works end to end rather than trusting that the
  # container created it. Uses the PDB service the application will use.
  ansible.builtin.shell:
    cmd: >-
      docker exec {{ oracle_container_name }}
      bash -lc "echo 'select 1 from dual;' |
      sqlplus -s {{ oracle_app_user }}/\"{{ oracle_app_password }}\"@//localhost:1521/{{ oracle_pdb }}"
  become: true
  register: xe_login
  changed_when: false
  failed_when: >-
    xe_login.rc != 0 or
    'ORA-' in xe_login.stdout or
    '1' not in xe_login.stdout
  no_log: true

- name: Report the database endpoint
  ansible.builtin.debug:
    msg: >-
      Oracle XE ready — jdbc:oracle:thin:@//{{ ansible_default_ipv4.address }}:{{ oracle_listener_port }}/{{ oracle_pdb }}
      (app user {{ oracle_app_user }})
