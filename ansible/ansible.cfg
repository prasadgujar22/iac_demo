[defaults]
# Dynamic inventory: merges the static topology with Terraform-generated facts
# (the DB VM's IP is only known after apply). A static inventory cannot reach
# the database host and fails with "Could not resolve hostname oracle-db".
inventory              = inventory/terraform_inventory.py
# The shell/script modules default to /bin/sh, which on Debian/Ubuntu is dash.
# dash has no 'pipefail', so every task using `set -euo pipefail` dies with
#   /bin/sh: 1: set: Illegal option -o pipefail
# Force bash for all shell tasks rather than annotating each one.
executable             = /bin/bash
roles_path             = roles
host_key_checking      = False
retry_files_enabled    = False
stdout_callback        = default
# YAML-formatted output: the old community.general.yaml callback was REMOVED in
# community.general 12.0.0. Use the built-in option instead (ansible-core >= 2.13).
result_format          = yaml
bin_ansible_callbacks  = True
interpreter_python     = auto_silent
display_skipped_hosts  = False
forks                  = 10

[ssh_connection]
pipelining = True
ssh_args   = -o ControlMaster=auto -o ControlPersist=120s -o ServerAliveInterval=30
